name: Auto commit by random time

on:
  schedule:
    - cron: "0 * * * *"   # setiap 1 jam
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git and Random Commit
        run: |
          git config --local user.email "thaariqprs97@gmail.com"
          git config --local user.name "MasThor"

          # ===== RANDOM DECISION =====
          # 0 = skip, 1 = run
          RUN=$((RANDOM % 3))   # ~33% chance jalan

          if [ "$RUN" -ne 1 ]; then
            echo "⏭ Skip this hour (random decision)"
            exit 0
          fi

          # ===== COMMIT MESSAGES =====
          commit_messages=(
            "😂 what are you looking for on here ?"
            "😱 what are you looking for on here ?"
            "👿 what are you looking for on here ?"
            "💩 what are you looking for on here ?"
            "🙏 what are you looking for on here ?"
            "🙈 what are you looking for on here ?"
            "🐐 what are you looking for on here ?"
            "🤖 what are you looking for on here ?"
            "🟩 what are you looking for on here ?"
            "👻 what are you looking for on here ?"
          )

          random_index=$((RANDOM % ${#commit_messages[@]}))
          commit_message="${commit_messages[$random_index]}"

          # ===== MAKE CHANGE =====
          echo "Updated at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > LAST_CHANGES
          git add LAST_CHANGES

          # ===== SAFE COMMIT =====
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "$commit_message"

      - name: Push changes
        run: |
          git pull origin main --rebase
          git push origin main
